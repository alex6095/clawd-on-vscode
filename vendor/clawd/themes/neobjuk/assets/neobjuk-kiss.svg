  </g></g></g><g transform="translate(54 104) rotate(-18) scale(1.2)"><g class="nb-heart"><path class="nb-ink" stroke="#151b22" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M0 8C-3 1-10-3-15 2C-22 9-14 21 0 29C14 21 22 9 15 2C10-3 3 1 0 8Z" fill="#ec008c" /></g></g>
